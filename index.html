<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VtM Dice Roller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>VtM Dice Roller</h1>
    <p id="status" class="status" hidden></p>

    <form id="roll-form">
      <label>Name
        <input id="name" maxlength="40" required>
      </label>
      <label>Action
        <input id="action" maxlength="100" placeholder="e.g. Dex + Firearms">
      </label>
      <div class="row">
        <label>Pool
          <input id="pool" type="number" min="1" max="30" value="5" required>
        </label>
        <label>Difficulty
          <input id="difficulty" type="number" min="2" max="10" value="6" required>
        </label>
      </div>
      <label class="check">
        <input id="willpower" type="checkbox"> Spend Willpower
      </label>
      <button type="submit">Roll</button>
    </form>

    <h2>Rolls</h2>
    <ol id="log" class="log"></ol>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
